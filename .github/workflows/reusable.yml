name: Reusable build workflow

permissions: read-all

on:
  workflow_call:
    inputs:
      os_version:
        required: true
        type: string
      qt_version:
        required: true
        type: string
      shared:
        required: false
        default: "ON"
        type: string
      dual_build:
        required: false
        default: false
        type: boolean
      zlib_const:
        required: false
        default: "OFF"
        type: string
      qtextcodec:
        required: false
        default: "ON"
        type: string
      runs_on:
        required: true
        type: string
      run_tests:
        required: false
        default: true
        type: boolean
      cross_extract:
        required: false
        default: false
        type: boolean
    secrets:
        GH_TOKEN:
            required: false

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  # All aqt options: https://ddalcino.github.io/aqt-list-server/
  BUILD_TYPE: Release

jobs:
  build:
    runs-on:  ${{ inputs.runs_on }}
    name: Build-${{ inputs.runs_on }}-Qt-${{ inputs.qt_version }}-shared-${{ inputs.shared }}${{ inputs.dual_build && '-dual' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt6
        if: "startsWith(inputs.qt_version, '6.')"
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ inputs.qt_version }}
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-Qt-Cache-${{ inputs.qt_version }}
          dir: ${{ github.workspace }}/Qt
          modules: 'qt5compat'

      - name: Install Qt5
        if: "startsWith(inputs.qt_version, '5.')"
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ inputs.qt_version }}
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-Qt-Cache-${{ inputs.qt_version }}
          dir: ${{ github.workspace }}/Qt

      - name: Install libraries (Linux Only)
        if: contains(inputs.runs_on, 'ubuntu')
        run: |
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends \
          zlib1g-dev libbz2-dev

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=(
            "-DCMAKE_BUILD_TYPE=${BUILD_TYPE}"
            "-DBUILD_SHARED_LIBS=${{ inputs.shared }}"
            "-DQUAZIP_ENABLE_TESTS=ON"
            "-DZLIB_CONST=${{ inputs.zlib_const }}"
            "-DQUAZIP_ENABLE_QTEXTCODEC=${{ inputs.qtextcodec }}"
            -B "${GITHUB_WORKSPACE}/build"
          )
          if [[ "${{ inputs.dual_build }}" == "true" ]]; then
            cmake_args+=(
              "-DQUAZIP_BUILD_SHARED=ON"
              "-DQUAZIP_BUILD_STATIC=ON"
              "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/install"
            )
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Verify Qt6Core5Compat in pkg-config file
        if: "startsWith(inputs.qt_version, '6.') && inputs.qtextcodec != 'OFF'"
        run: grep -q "Qt6Core5Compat" ${{github.workspace}}/build/quazip/*.pc

      - name: Run tests
        if: inputs.run_tests && !inputs.cross_extract
        working-directory: ${{github.workspace}}/build
        env:
          TEST_CR_COMPRESS: "true"
          #TEST_ZIP_UNZIP_LARGE: true
        run: ctest --verbose

      - name: Verify installed dual build
        if: inputs.dual_build
        run: |
          cmake --install "${GITHUB_WORKSPACE}/build" --config "${BUILD_TYPE}"
          cmake \
            -S "${GITHUB_WORKSPACE}/cmake/dual-build-consumer" \
            -B "${GITHUB_WORKSPACE}/consumer-build" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/install"
          cmake --build "${GITHUB_WORKSPACE}/consumer-build" --config "${BUILD_TYPE}"
          ctest \
            --test-dir "${GITHUB_WORKSPACE}/consumer-build" \
            --build-config "${BUILD_TYPE}" \
            --output-on-failure

      - name: Upload cp.zip to GitHub Actions Storage
        if: inputs.run_tests && !inputs.cross_extract
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          overwrite: true
          name: "${{ inputs.runs_on }}_qt${{ inputs.qt_version }}_shared${{ inputs.shared }}${{ inputs.dual_build && '_dual' || '' }}_cp"
          path: build/quazip/cp.zip

      - name: Download bundle containing cp.zip
        if: inputs.cross_extract
        uses: actions/download-artifact@v8
        with:
          path: build/quazip
          merge-multiple: false

      - name: Run extract tests
        if: inputs.cross_extract
        working-directory: ${{github.workspace}}/build
        env:
          TEST_CR_DECOMPRESS: "true"
        run: ctest --verbose


