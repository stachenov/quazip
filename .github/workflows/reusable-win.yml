name: Reusable Windows Build Workflow

permissions: read-all

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: false
        default: 'windows-latest'
        type: string
      qt_version:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      preset:
        required: true
        type: string
      pe_str:
        required: true
        type: string
      dual_build:
        required: false
        default: false
        type: boolean
      run_tests:
        required: false
        default: true
        type: boolean
      cross_extract:
        required: false
        default: false
        type: boolean
      test_cr_compress:
        required: false
        default: true
        type: boolean
      test_utf8_compress:
        required: false
        default: false
        type: boolean
      test_utf8_decompress:
        required: false
        default: false
        type: boolean
      test_utf8_archive_type:
        required: false
        default: "with_flag"
        type: string
    secrets:
      GH_TOKEN:
        required: false

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  # All aqt options: https://ddalcino.github.io/aqt-list-server/
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    name: Windows-${{ inputs.arch }}-Qt-${{ inputs.qt_version }}-Preset-${{ inputs.preset }}${{ inputs.dual_build && '-dual' || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        if: "startsWith(inputs.qt_version, '6.')"
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ inputs.qt_version }}
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-Qt-Cache-${{ inputs.qt_version }}
          dir: ${{ github.workspace }}/Qt
          modules: 'qt5compat'
          arch: 'win64_msvc2022_64'

      - name: Install Qt5
        if: "startsWith(inputs.qt_version, '5.')"
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ inputs.qt_version }}
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-Qt-Cache-${{ inputs.qt_version }}
          dir: ${{ github.workspace }}/Qt
          arch: ${{ inputs.arch == 'x86' && 'win32_msvc2019' || 'win64_msvc2019_64' }}

      - uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: ${{ inputs.arch }}

      - name: Install Conan
        if: contains(inputs.preset, 'conan')
        uses: turtlebrowser/get-conan@main

      - name: Init Conan
        if: contains(inputs.preset, 'conan')
        run: conan profile detect

      - name: Install dependencies with Conan
        if: contains(inputs.preset, 'conan')
        shell: cmd
        run: conan install . -of build -s build_type=Release -o *:shared=False --build=missing ${{ inputs.arch == 'x86' && '-s:h arch=x86' || '' }}

      - name: Configure
        shell: cmd
        run: cmake --preset ${{ inputs.preset }} -DQUAZIP_ENABLE_TESTS=ON -DQUAZIP_BUILD_SHARED=ON -DQUAZIP_BUILD_STATIC=${{ inputs.dual_build && 'ON' || 'OFF' }} -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install"

      - name: Build
        shell: cmd
        run: cmake --build ${{github.workspace}}/build --config Release

      # This second build is here temporarily until we figure out why qztest dep .dlls are not copied after first build
      - name: Build 2
        shell: cmd
        run: cmake --build ${{github.workspace}}/build --config Release

      - name: Check PE
        shell: bash
        working-directory: ./build/quazip/Release
        run: |
          DLL_NAME="quazip1-qt${{ startsWith(inputs.qt_version, '6') && '6' || '5' }}.dll"
          file "$DLL_NAME"
          file "$DLL_NAME" |grep "${{ inputs.pe_str }}"

      - name: Download UTF-8 archives
        if: inputs.test_utf8_decompress
        uses: actions/download-artifact@v8
        with:
          path: build/quazip
          merge-multiple: false

      - name: Run tests
        if: inputs.run_tests && !inputs.cross_extract
        env:
          TEST_CR_COMPRESS: ${{ inputs.test_cr_compress }}
          TEST_UTF8_COMPRESS: ${{ inputs.test_utf8_compress  }}
          TEST_UTF8_DECOMPRESS: ${{ inputs.test_utf8_decompress  }}
          TEST_UTF8_ARCHIVE_TYPE: ${{ inputs.test_utf8_archive_type }}
          #TEST_ZIP_UNZIP_LARGE: true
          QT_ASSUME_STDERR_HAS_CONSOLE: 1 # !! qDebug() is not visible if this is not set on Win runners
        working-directory: ./build
        run: ctest --verbose -C Release

      - name: Verify installed dual build
        if: inputs.dual_build
        shell: pwsh
        run: |
          $toolchainArgs = @()
          if ("${{ inputs.preset }}" -like "conan*") {
            $toolchainArgs += "-DCMAKE_TOOLCHAIN_FILE=${env:GITHUB_WORKSPACE}/build/conan_toolchain.cmake"
            $toolchainArgs += "-DCMAKE_POLICY_DEFAULT_CMP0091=NEW"
          } elseif ("${{ inputs.preset }}" -like "vcpkg*") {
            $triplet = "${{ inputs.arch }}" -eq "x86" ? "x86-windows" : "x64-windows"
            $toolchainArgs += "-DCMAKE_TOOLCHAIN_FILE=${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
            $toolchainArgs += "-DVCPKG_TARGET_TRIPLET=${triplet}"
            $toolchainArgs += "-DVCPKG_HOST_TRIPLET=${triplet}"
          }

          cmake --install "${env:GITHUB_WORKSPACE}/build" --config Release
          if ($LASTEXITCODE -ne 0) {
            throw "QuaZip installation failed"
          }
          cmake `
            -S "${env:GITHUB_WORKSPACE}/cmake/dual-build-consumer" `
            -B "${env:GITHUB_WORKSPACE}/consumer-build" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${env:GITHUB_WORKSPACE}/install" `
            @toolchainArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Dual-build consumer configuration failed"
          }
          cmake --build "${env:GITHUB_WORKSPACE}/consumer-build" --config Release
          if ($LASTEXITCODE -ne 0) {
            throw "Dual-build consumer compilation failed"
          }

          $env:PATH = "${env:GITHUB_WORKSPACE}/install/bin;${env:PATH}"
          ctest `
            --test-dir "${env:GITHUB_WORKSPACE}/consumer-build" `
            --build-config Release `
            --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "Dual-build consumer tests failed"
          }

          $staticLibrary = Get-ChildItem `
            "${env:GITHUB_WORKSPACE}/install/lib" `
            -Filter "*-static.lib" |
            Select-Object -First 1
          if (-not $staticLibrary) {
            throw "Installed static QuaZip library was not found"
          }
          $directives = & dumpbin /directives $staticLibrary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the static QuaZip library"
          }
          if ($directives -match "/EXPORT:") {
            throw "Static QuaZip library contains DLL export directives"
          }

          $staticConsumer = Get-ChildItem `
            "${env:GITHUB_WORKSPACE}/consumer-build" `
            -Recurse `
            -Filter "consumerStatic.exe" |
            Select-Object -First 1
          if (-not $staticConsumer) {
            throw "Static consumer executable was not found"
          }
          $exports = & dumpbin /exports $staticConsumer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the static consumer executable"
          }
          $exportRows = $exports |
            Select-String "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+"
          if ($exportRows -match "QuaZip|JlCompress") {
            throw "Static consumer unexpectedly exports QuaZip symbols"
          }

      - name: Upload cp.zip to GitHub Actions Storage
        if: inputs.run_tests && !inputs.cross_extract
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          overwrite: true
          name: "${{ inputs.runs_on }}_${{ inputs.preset }}_qt${{ inputs.qt_version }}_shared${{ inputs.shared }}_cp"
          path: build/quazip/cp.zip

      - name: Download bundle containing cp.zip
        if: inputs.cross_extract
        uses: actions/download-artifact@v8
        with:
          path: build/quazip
          merge-multiple: false

      - name: Run extract tests
        if: inputs.cross_extract
        working-directory: ${{github.workspace}}/build
        env:
          TEST_CR_DECOMPRESS: "true"
          QT_ASSUME_STDERR_HAS_CONSOLE: 1
        run: ctest --verbose -C Release
